name: Auto Update M3U Playlists

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Script Utama (Series & Movie)
        run: python generate_m3u.py

      - name: Run Script Khusus (Live & Upcoming)
        run: python generate_live.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add *.m3u
          
          git commit -m "Auto-update 5 playlists $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          
          git pull --rebase origin main
          git push
